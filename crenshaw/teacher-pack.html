<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Pack</title>
  <link rel="icon" href="images/placeholder/logo-crenshaw.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="book.css" />
</head>
<body data-book="teacher">
  <div class="book-toolbar">
    <img src="images/web/logo-crenshaw.webp" alt="" onerror="this.onerror=null;this.src='images/placeholder/logo-crenshaw.svg'" />
    <div><b class="tb-title">Teacher Pack</b><span class="sub">Crenshaw · <span id="pageCount">building pages…</span></span></div>
    <div class="grow"></div>
    <span class="tb-tip">Print tip: choose <b>A4</b>, margins <b>None</b>, turn <b>on</b> "Background graphics" and <b>off</b> "Headers and footers". Or choose "Save as PDF".</span>
    <a class="tb-btn ghost" href="index.html">← Back to the app</a>
    <button class="tb-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>
  <div class="loading" id="loading">Building your pages…</div>
  <main class="book" id="book"></main>
  <script src="imgfix.js"></script>
  <script src="data.js"></script>
  <script src="book.js"></script>
</body>
</html>
