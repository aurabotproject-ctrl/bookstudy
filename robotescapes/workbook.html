<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Workbook</title>
  <link rel="icon" href="images/web/logo-feather.webp" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="book.css" />
</head>
<body data-book="workbook">
  <div class="book-toolbar">
    <img src="images/web/icon-journal.webp" alt="" />

  <div class="loading" id="loading">Building your pages…</div>
  <main class="book" id="book"></main>
  <script src="data.js"></script>
  <script src="book.js"></script>
